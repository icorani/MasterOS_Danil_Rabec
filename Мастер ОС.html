<!--
CHANGELOG Мастер ОС
- Мобильная доработка 2D Studio по видеозаписи Android: убран перенос дублирующего заголовка, оптимизированы панели и увеличено место холста при отсутствии выбранного объекта.
- Улучшены safe-area, анимации окон, видимость фокуса и адаптивность для экранов 320px.
- Добавлены настраиваемые акцентный цвет и градиентные обои с сохранением параметров.
- Добавлены Терминал, «Свернуть всё» и индикатор запуска тяжёлых приложений.
- Проводник получил мультивыбор, поиск по всей ФС, сортировку, inline-переименование и drag-and-drop.
- Корзина запоминает папку-источник и восстанавливает элементы на прежнее место.
- Обработаны ошибки квоты localStorage; сохранение сцены можно выполнять с debounce.
- Добавлены undo/redo, копирование/вставка, мультивыделение и привязка к сетке в 2D Studio.
- Физика переведена на фиксированный шаг; скрипты объектов исполняются в Web Worker с тайм-аутом.
- Редактор текстур поддерживает выбор цвета фона, сглаживание края и масштабирование превью.
- Blender 2D получил ластик с прозрачностью, мягкую кисть, redo, ползунок кадра и миниатюры.
- Проект Blender 2D можно сохранить в виртуальную папку «Документы».
- Добавлены дополнительные проверки данных, экранирование динамических строк и доступность клавиатуры.
- Настраиваемое управление в 2D Studio: стик (8 направлений), добавление/удаление кнопок, смена их назначения; режим «Вид сверху»; настройки сохраняются в сцене и попадают в экспорт игры.
-->

let zTop=30, toastTimer=null, contextTimer=null;
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
function makeId(){return 'id'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function humanSize(n){if(!n)return '—';if(n<1024)return n+' Б';if(n<1048576)return (n/1024).toFixed(1)+' КБ';return (n/1048576).toFixed(1)+' МБ'}
function downloadBlob(name,content,type='application/octet-stream'){const blob=content instanceof Blob?content:new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function dataURLFromBlob(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
function dataUrlSize(s){try{return Math.ceil((s.length*3)/4)}catch{return 0}}

const FS_KEY='win11mobile_fs_v1', TRASH_KEY='win11mobile_trash_v1';
function demoFs(){
 const folder=(name,children=[])=>({id:makeId(),name,type:'folder',children});
 const file=(name,content='',mime='text/plain')=>({id:makeId(),name,type:'file',content,mime,size:content.length,modified:Date.now()});
 const docs=folder('Документы',[file('Добро пожаловать.txt','Добро пожаловать в Мастер ОС!\n\nЭто автономная демонстрационная оболочка Windows 11.\n\nОткройте 2D Studio, чтобы создавать платформеры, редактировать объекты и удалять белый фон с текстур.','text/plain'),file('Заметки.txt','Идеи проекта:\n- Создать сцену\n- Добавить платформы\n- Загрузить текстуру','text/plain')]);
 const downloads=folder('Загрузки',[file('Пример.json',JSON.stringify({hello:'Мастер ОС',version:1},null,2),'application/json')]);
 return {id:'root',name:'Этот компьютер',type:'folder',children:[folder('Рабочий стол',[file('Привет.txt','Привет! Это твой рабочий стол.','text/plain')]),docs,downloads,folder('Изображения'),folder('Музыка'),folder('Видео'),folder('Программы')]};
}
let vfs, recycleBin, fsClipboard=null;
function loadFs(){try{vfs=JSON.parse(localStorage.getItem(FS_KEY))||demoFs();recycleBin=JSON.parse(localStorage.getItem(TRASH_KEY))||[]}catch{vfs=demoFs();recycleBin=[]} }
function saveFs(){try{localStorage.setItem(FS_KEY,JSON.stringify(vfs));localStorage.setItem(TRASH_KEY,JSON.stringify(recycleBin));}catch(e){toast('Не удалось сохранить: возможно, закончилось место браузера.');console.warn(e)}}
loadFs();
function getFolderByIds(ids,root=vfs){let node=root;for(const id of ids){if(!node||node.type!=='folder')return null;node=node.children.find(x=>x.id===id);if(!node)return null}return node}
function findNode(id,node=vfs){if(node.id===id)return node;if(node.type==='folder'){for(const ch of node.children){const r=findNode(id,ch);if(r)return r}}return null}
function findParent(id,node=vfs){if(node.type!=='folder')return null;for(const child of node.children){if(child.id===id)return node;const r=findParent(id,child);if(r)return r}return null}
function getFolderPath(ids){let node=vfs,parts=[];for(const id of ids){node=node.children.find(x=>x.id===id);if(!node)break;parts.push(node.name)}return parts}
function uniqueName(folder,name,excludeId=null){let base=name,ext='',dot=name.lastIndexOf('.');if(dot>0){base=name.slice(0,dot);ext=name.slice(dot)}let out=name,n=2;while(folder.children.some(x=>x.name.toLowerCase()===out.toLowerCase()&&x.id!==excludeId)){out=`${base} (${n++})${ext}`}return out}
function folderPathFromDefault(name){const child=vfs.children.find(x=>x.name===name);return child?[child.id]:[]}
function createFile(folder,name,opts={}){const obj={id:makeId(),name:uniqueName(folder,name),type:opts.type||'file',content:opts.content||'',mime:opts.mime||'text/plain',size:opts.size||((opts.content||'').length),dataUrl:opts.dataUrl||null,modified:Date.now()};if(obj.type==='folder')obj.children=[];folder.children.push(obj);saveFs();return obj}
function ensurePicturesFolder(){let f=vfs.children.find(x=>x.name==='Изображения'&&x.type==='folder');if(!f){f={id:makeId(),name:'Изображения',type:'folder',children:[]};vfs.children.push(f);saveFs()}return f}

function navigateExplorer(key){explorerState.recycle=false;explorerState.selected=null;explorerState.search='';if(key==='home')explorerState.path=[];else{const names={desktop:'Рабочий стол',docs:'Документы',downloads:'Загрузки',pictures:'Изображения',music:'Музыка',videos:'Видео'};const f=vfs.children.find(x=>x.name===names[key]);explorerState.path=f?[f.id]:[]}const win=windows.get('explorer');if(win)renderExplorer($('.explorer',win));}

function openFsItem(id){const node=explorerState.recycle?recycleBin.find(x=>x.id===id):findNode(id);if(!node)return;if(node.type==='folder'){explorerState.search='';const searchInput=$('.explorer [data-fsearch]');if(searchInput)searchInput.value='';const path=explorerState.recycle?[]:findPathToNode(id);if(path){explorerState.path=path;explorerState.recycle=false;explorerState.selected=null;if(explorerState.selectedIds instanceof Set)explorerState.selectedIds.clear();const win=windows.get('explorer');if(win)renderExplorer($('.explorer',win))}return}if(node.type==='image'||node.mime?.startsWith('image/')){launchApp('photos',{node});return}if(node.mime==='text/plain'||node.mime?.includes('json')||node.name.endsWith('.txt')||node.name.endsWith('.json')||node.name.endsWith('.js')||node.name.endsWith('.html')){launchApp('notepad',{node});return}toast('Тип файла не поддерживается в просмотре')}

/* ===== Управление: стик, кнопки, назначения (общая библиотека для студии и экспортируемой игры) ===== */
function mosCtlLib(){
  const ACT={left:['◀','Влево'],right:['▶','Вправо'],up:['↑','Вверх'],down:['↓','Вниз'],jump:['▲','Прыжок'],run:['»','Ускорение']};
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let uid=0;
  const nid=()=>'c'+Date.now().toString(36)+(uid++).toString(36);
  function newItem(type,action,x,y,size,label){
    const st=type==='stick',a=ACT[action]?action:'jump';
    return {id:nid(),type:st?'stick':'button',action:st?'move':a,label:label==null?(st?'':ACT[a][0]):String(label),x:x,y:y,size:size};
  }
  const presets={
    buttons:()=>({mode:'platformer',items:[newItem('button','left',12,84,60),newItem('button','right',32,84,60),newItem('button','jump',88,84,64)]}),
    stickJump:()=>({mode:'platformer',items:[newItem('stick',null,16,76,120),newItem('button','jump',89,82,72)]}),
    topdown:()=>({mode:'topdown',items:[newItem('stick',null,16,76,120)]}),
    topdownRun:()=>({mode:'topdown',items:[newItem('stick',null,16,76,120),newItem('button','run',89,82,64)]})
  };
  function normalize(c){
    if(!c||typeof c!=='object'||!Array.isArray(c.items))return presets.buttons();
    const items=[],seen=new Set();
    for(const it of c.items.slice(0,16)){
      if(!it||typeof it!=='object')continue;
      const type=it.type==='stick'?'stick':'button';
      const action=type==='stick'?'move':(ACT[it.action]?it.action:'jump');
      let id=String(it.id||'').slice(0,24);if(!id||seen.has(id))id=nid();seen.add(id);
      items.push({id:id,type:type,action:action,
        label:String(it.label==null?(type==='stick'?'':ACT[action][0]):it.label).slice(0,3),
        x:clamp(Number(it.x)||0,0,100),y:clamp(Number(it.y)||0,0,100),size:clamp(Number(it.size)||60,36,160)});
    }
    return {mode:c.mode==='topdown'?'topdown':'platformer',items:items};
  }
  function keyActions(raw){
    const s=new Set();
    for(const k of raw){
      const l=String(k).toLowerCase();
      if(l==='arrowleft'||l==='a')s.add('left');
      else if(l==='arrowright'||l==='d')s.add('right');
      else if(l==='arrowup'||l==='w')s.add('up');
      else if(l==='arrowdown'||l==='s')s.add('down');
      else if(l===' ')s.add('jump');
      else if(l==='shift')s.add('run');
    }
    return s;
  }
  function newState(){return {btn:new Set(),stick:{x:0,y:0}}}
  /* Единое чтение ввода: клавиатура + кнопки + стик -> вектор движения, прыжок, ускорение */
  function read(mode,act,st){
    const has=function(a){return act.has(a)||(st&&st.btn&&st.btn.has(a))};
    let mx=(has('right')?1:0)-(has('left')?1:0),my=(has('down')?1:0)-(has('up')?1:0),sx=0,sy=0;
    if(st&&st.stick){
      const m=Math.hypot(st.stick.x,st.stick.y);
      if(m>.18){const k=Math.min(1,(m-.18)/.62)/m;sx=st.stick.x*k;sy=st.stick.y*k}
    }
    mx+=sx;my+=sy;
    const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
    const jump=has('jump')||(mode!=='topdown'&&(has('up')||sy<-.6));
    return {mx:mx,my:my,jump:jump,run:has('run')};
  }
  function ensureStyle(){
    if(document.getElementById('mos-ctl-style'))return;
    const s=document.createElement('style');s.id='mos-ctl-style';
    s.textContent=[
      '.mos-ctl-host{position:absolute;inset:0;pointer-events:none;z-index:6;display:none}',
      '.mos-ctl-host.show{display:block}',
      '.mos-ctl{position:absolute;display:flex;align-items:center;justify-content:center;box-sizing:border-box;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;color:#fff;font:600 22px system-ui,sans-serif;border:1px solid #ffffff55;background:#16263ccc;cursor:pointer}',
      '.mos-ctl.btn{border-radius:16px;backdrop-filter:blur(6px)}',
      '.mos-ctl.btn.on{background:#4d9cf5dd;transform:scale(.94)}',
      '.mos-ctl.stick{border-radius:50%;background:radial-gradient(circle,#16263c99 55%,#16263c55)}',
      '.mos-knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:#ffffffd0;box-shadow:0 2px 8px #0006;pointer-events:none}',
      '.mos-ctl.edit{cursor:grab;outline:2px dashed #ffffff99;outline-offset:2px}',
      '.mos-ctl.edit.sel{outline:2px solid #ffd54a}'
    ].join('');
    document.head.appendChild(s);
  }
  /* Рисует элементы управления в host. opts.edit — режим редактора (перетаскивание). */
  function build(host,ctl,st,opts){
    opts=opts||{};ensureStyle();host.innerHTML='';
    const edit=!!opts.edit,els=new Map();
    function place(){
      const W=host.clientWidth,H=host.clientHeight;if(!W||!H)return;
      ctl.items.forEach(function(it){
        const el=els.get(it.id);if(!el)return;
        const s=it.size,cx=clamp(it.x/100*W,s/2,Math.max(s/2,W-s/2)),cy=clamp(it.y/100*H,s/2,Math.max(s/2,H-s/2));
        el.style.left=(cx-s/2)+'px';el.style.top=(cy-s/2)+'px';
      });
    }
    ctl.items.forEach(function(it){
      const isStick=it.type==='stick',el=document.createElement('div');
      el.className='mos-ctl '+(isStick?'stick':'btn')+(edit?' edit':'');
      el.dataset.ctlId=it.id;
      el.style.width=el.style.height=it.size+'px';
      el.style.fontSize=Math.round(it.size*.4)+'px';
      el.setAttribute('role','button');
      el.setAttribute('aria-label',isStick?'Стик':(ACT[it.action]?ACT[it.action][1]:'Кнопка'));
      el.addEventListener('contextmenu',function(e){e.preventDefault()});
      let knob=null;
      if(isStick){knob=document.createElement('div');knob.className='mos-knob';el.appendChild(knob)}else el.textContent=it.label;
      if(edit){
        let drag=null;
        el.addEventListener('pointerdown',function(e){
          e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
          const r=el.getBoundingClientRect();
          drag={pid:e.pointerId,dx:e.clientX-(r.left+r.width/2),dy:e.clientY-(r.top+r.height/2)};
          if(opts.onSelect)opts.onSelect(it.id);
        });
        el.addEventListener('pointermove',function(e){
          if(!drag||drag.pid!==e.pointerId)return;
          const r=host.getBoundingClientRect();if(!r.width||!r.height)return;
          it.x=clamp((e.clientX-drag.dx-r.left)/r.width*100,0,100);
          it.y=clamp((e.clientY-drag.dy-r.top)/r.height*100,0,100);
          place();
        });
        const end=function(e){if(!drag||drag.pid!==e.pointerId)return;drag=null;if(opts.onChange)opts.onChange()};
        el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
      }else if(isStick){
        let pid=null;
        const upd=function(e){
          const r=el.getBoundingClientRect(),R=r.width/2;
          let vx=(e.clientX-(r.left+R))/(R*.7),vy=(e.clientY-(r.top+R))/(R*.7);
          const l=Math.hypot(vx,vy);if(l>1){vx/=l;vy/=l}
          st.stick.x=vx;st.stick.y=vy;
          knob.style.transform='translate('+(vx*R*.55)+'px,'+(vy*R*.55)+'px)';
        };
        el.addEventListener('pointerdown',function(e){if(pid!=null)return;e.preventDefault();pid=e.pointerId;try{el.setPointerCapture(pid)}catch(_){}upd(e)});
        el.addEventListener('pointermove',function(e){if(e.pointerId===pid)upd(e)});
        const rel=function(e){if(e.pointerId!==pid)return;pid=null;st.stick.x=0;st.stick.y=0;knob.style.transform=''};
        ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){el.addEventListener(ev,rel)});
      }else{
        const pids=new Set();
        el.addEventListener('pointerdown',function(e){e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}pids.add(e.pointerId);st.btn.add(it.action);el.classList.add('on')});
        const rel=function(e){pids.delete(e.pointerId);if(!pids.size){st.btn.delete(it.action);el.classList.remove('on')}};
        ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){el.addEventListener(ev,rel)});
      }
      els.set(it.id,el);host.appendChild(el);
    });
    place();
    let ro=null;if(typeof ResizeObserver!=='undefined'){ro=new ResizeObserver(place);ro.observe(host)}
    return {
      destroy:function(){if(ro)ro.disconnect();host.innerHTML='';if(st){st.btn.clear();st.stick.x=0;st.stick.y=0}},
      select:function(id){els.forEach(function(el,k){el.classList.toggle('sel',k===id)})},
      place:place
    };
  }
  return {ACT:ACT,presets:presets,newItem:newItem,normalize:normalize,keyActions:keyActions,newState:newState,read:read,build:build};
}

 if(o.id===studioState.selected&&!studioState.playing){ctx.save();ctx.strokeStyle='#1478e5';ctx.lineWidth=1.6;ctx.setLineDash([5,3]);ctx.strokeRect(p.x-2,p.y-2,p.w+4,p.h+4);ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.strokeStyle='#1478e5';ctx.lineWidth=1.5;[[p.x,p.y],[p.x+p.w,p.y],[p.x,p.y+p.h],[p.x+p.w,p.y+p.h]].forEach(([x,y])=>{ctx.beginPath();ctx.rect(x-3.5,y-3.5,7,7);ctx.fill();ctx.stroke()});ctx.restore()}}
 $('[data-hud-size]',root).textContent=`${scene.objects.length} объектов`; $('[data-hud-zoom]',root).textContent=Math.round(zoom*100)+'%';}
const textureImageCache=new Map();function getTextureImage(o){if(!o.texture)return null;let img=textureImageCache.get(o.id);if(!img||img._src!==o.texture){img=new Image();img._src=o.texture;img.src=o.texture;textureImageCache.set(o.id,img)}return img}
function drawPlaceholder(ctx,o,p){if(o.type==='trigger'){ctx.fillStyle=o.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.strokeStyle='#9c7d18';ctx.setLineDash([4,3]);ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);ctx.setLineDash([])}else if(o.type==='camera'){ctx.fillStyle=o.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.fillStyle='#fff';ctx.fillRect(-p.w*.26,-p.h*.16,p.w*.52,p.h*.32)}else{ctx.fillStyle=o.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);if(o.type==='sprite'){ctx.fillStyle='rgba(255,255,255,.36)';ctx.fillRect(-p.w*.28,-p.h*.27,p.w*.2,p.h*.2);ctx.fillStyle='#27364b';ctx.fillRect(-p.w*.2,-p.h*.08,p.w*.12,p.h*.12);ctx.fillRect(p.w*.08,-p.h*.08,p.w*.12,p.h*.12);ctx.fillStyle='rgba(30,45,65,.4)';ctx.fillRect(-p.w*.15,p.h*.18,p.w*.3,Math.max(2,p.h*.06))}}}
function canvasWorldPoint(e,root){const {c,r}=canvasMetrics(root);return {x:(e.clientX-r.left)/studioState.zoom+(studioState.cameraX||0),y:(e.clientY-r.top)/studioState.zoom+(studioState.cameraY||0)}}
function hitTest(point){for(const o of [...scene.objects].sort((a,b)=>(b.layer||0)-(a.layer||0))){if(point.x>=o.x&&point.x<=o.x+o.w&&point.y>=o.y&&point.y<=o.y+o.h)return o}return null}
function canvasPointerDown(e,root){const p=canvasWorldPoint(e,root);if(studioState.playing){const hit=hitTest(p);if(!hit){studioState.drag={pan:true,x:e.clientX,y:e.clientY,cx:studioState.cameraX,cy:studioState.cameraY,pointer:e.pointerId};e.currentTarget.setPointerCapture(e.pointerId)}return}const hit=hitTest(p);if(studioState.tool==='delete'){if(hit){studioState.selected=hit.id;deleteSelected()}return}if(studioState.tool==='rotate'){if(hit){studioState.selected=hit.id;hit.rotation=(hit.rotation||0)+15;saveScene();renderStudio(root)}return}if(studioState.tool==='scale'){if(hit){studioState.selected=hit.id;hit.w+=10;hit.h+=10;saveScene();renderStudio(root)}return}if(hit){studioState.selected=hit.id;if(studioState.tool==='move'||studioState.tool==='select'){studioState.drag={id:hit.id,dx:p.x-hit.x,dy:p.y-hit.y,pointer:e.pointerId};e.currentTarget.setPointerCapture(e.pointerId)}}else{studioState.selected=null;if(e.pointerType==='touch'){studioState.drag={pan:true,x:e.clientX,y:e.clientY,cx:studioState.cameraX,cy:studioState.cameraY,pointer:e.pointerId};e.currentTarget.setPointerCapture(e.pointerId)}}renderStudio(root)}
function canvasPointerMove(e,root){const d=studioState.drag;if(!d)return;if(d.pan){studioState.cameraX=d.cx-(e.clientX-d.x)/studioState.zoom;studioState.cameraY=d.cy-(e.clientY-d.y)/studioState.zoom;drawStudio(root);return}const o=scene.objects.find(x=>x.id===d.id);if(o){const p=canvasWorldPoint(e,root);o.x=Math.round(p.x-d.dx);o.y=Math.round(p.y-d.dy);renderProperties(root);drawStudio(root)}}
function canvasPointerUp(e,root){if(studioState.drag&&!studioState.drag.pan){saveScene();renderStudioTree(root)}studioState.drag=null}

/* ФИЗИКА: гравитация, AABB, пол, прыжок, триггеры */
function togglePlay(force){const next=force===undefined?!studioState.playing:!!force;if(next===studioState.playing)return;studioState.playing=next;studioState.lastTime=0;if(next){compileObjectScripts();studioLog('▶ Симуляция запущена');const p=scene.objects.find(o=>o.id==='player')||scene.objects.find(o=>o.type==='sprite');if(p){p.vx=0;p.vy=0;p.onGround=false;const m=canvasMetrics(windows.get('studio')&&$('.studio',windows.get('studio')));const z=studioState.zoom||1;studioState.cameraX=p.x+p.w/2-m.w/(2*z);studioState.cameraY=p.y+p.h/2-m.h/(2*z)}}else{studioLog('■ Симуляция остановлена');scene.objects.forEach(o=>{o.vx=0;o.vy=0})}const root=windows.get('studio')&&$('.studio',windows.get('studio'));if(root)renderStudio(root)}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function physicsStep(dt,root){const player=scene.objects.find(o=>o.id==='player')||scene.objects.find(o=>o.type==='sprite'&&o.gravity);if(!player)return;const worldW=Infinity,worldH=Infinity;if(studioState.keys.has('ArrowLeft')||studioState.keys.has('a'))player.vx=-190;else if(studioState.keys.has('ArrowRight')||studioState.keys.has('d'))player.vx=190;else player.vx*=Math.pow(.001,dt);if((studioState.keys.has('ArrowUp')||studioState.keys.has(' ')||studioState.keys.has('w'))&&player.onGround){player.vy=-370;player.onGround=false}
 if(player.gravity&&!player.static){player.vy=(player.vy||0)+scene.gravity*dt;player.x+=(player.vx||0)*dt;player.y+=(player.vy||0)*dt}
 player.onGround=false;for(const o of scene.objects){if(o.id===player.id||!o.solid||(!o.static&&o.gravity)||o.type==='trigger')continue;if(aabb(player,o)){const prevBottom=player.y+player.h-player.vy*dt;if(player.vy>=0&&prevBottom<=o.y+Math.max(10,Math.abs(player.vy*dt)+2)){player.y=o.y-player.h;player.vy=0;player.onGround=true}else if(player.vy<0&&player.y-o.vy*dt>=o.y+o.h){player.y=o.y+o.h;player.vy=0}else if(player.vx>0){player.x=o.x-player.w}else if(player.vx<0){player.x=o.x+o.w}}}
 // Не привязываем границы мира к размеру экрана: игрок может уходить за край,
 // а камера свободно следует за ним по горизонтали и вертикали.
 for(const t of scene.objects.filter(o=>o.type==='trigger'))if(aabb(player,t)&&!t._inside){t._inside=true;studioLog('Триггер активирован: '+t.name)}else if(!aabb(player,t))t._inside=false;
}
function updateFollowCamera(root,dt){
 const player=scene.objects.find(o=>o.id==='player')||scene.objects.find(o=>o.type==='sprite'&&o.gravity);
 if(!player)return;
 const m=canvasMetrics(root),zoom=studioState.zoom||1;
 const viewW=m.w/zoom,viewH=m.h/zoom;
 const targetX=player.x+player.w/2-viewW/2;
 const targetY=player.y+player.h/2-viewH/2;
 // Камера плавно центрирует игрока по обеим осям.
 const blend=1-Math.exp(-Math.max(0,dt)*10);
 studioState.cameraX+=(targetX-studioState.cameraX)*blend;
 studioState.cameraY+=(targetY-studioState.cameraY)*blend;
}

function studioLoop(){const win=windows.get('studio'),root=win&&$('.studio',win);if(!root||!win.classList.contains('open')||win.classList.contains('minimized')){studioState.raf=0;studioState.lastTime=0;return}studioState.raf=requestAnimationFrame(studioLoop);const now=performance.now();let dt=studioState.lastTime?(now-studioState.lastTime)/1000:0;studioState.lastTime=now;dt=Math.min(dt,.035);if(studioState.playing&&dt>0){physicsStep(dt,root);runObjectScripts(dt);updateFollowCamera(root,dt)}drawStudio(root)}
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;const root=windows.get('studio')&&$('.studio',windows.get('studio'));if(!root)return;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)&&studioState.playing){e.preventDefault();studioState.keys.add(e.key)}if(e.key==='Delete'&&studioState.selected)deleteSelected();if(e.key==='Escape'&&studioState.playing)togglePlay(false)});window.addEventListener('keyup',e=>studioState.keys.delete(e.key));

/* ============================================================
   РЕДАКТОР ТЕКСТУР: getImageData / putImageData, RGB threshold
   ============================================================ */
function openTextureEditor(root){if(!root)return;studioState.textureObjectId=studioState.selected;const shade=$('[data-modal-shade]',root);shade.classList.remove('hidden');if(studioState.textureOriginal){drawTexturePreview(root);processTexture(root)}else{$('[data-texture-status]',root).textContent='Выберите изображение кнопкой «Загрузить изображение».'}const slider=$('[data-threshold]',root);slider.value=studioState.textureThreshold||240;$('[data-threshold-value]',root).textContent=slider.value}
function closeTextureEditor(root){$('[data-modal-shade]',root).classList.add('hidden')}
function paintPreview(canvas,img){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(!img)return;const ratio=Math.min(canvas.width/img.naturalWidth,canvas.height/img.naturalHeight);const w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h)}
function drawTexturePreview(root){paintPreview($('[data-preview-original]',root),studioState.textureOriginal);if(!studioState.textureOriginal){const c=$('[data-preview-processed]',root);c.getContext('2d').clearRect(0,0,c.width,c.height)}}
function processTexture(root){const img=studioState.textureOriginal;if(!img)return;const maxSide=1800,ratio=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.max(1,Math.round(img.naturalWidth*ratio)),h=Math.max(1,Math.round(img.naturalHeight*ratio));const source=document.createElement('canvas');source.width=w;source.height=h;const sc=source.getContext('2d',{willReadFrequently:true});sc.drawImage(img,0,0,w,h);let imageData;try{imageData=sc.getImageData(0,0,w,h)}catch(err){studioLog('Браузер запретил обработку пикселей изображения','error');return}const px=imageData.data,threshold=studioState.textureThreshold||240;let removed=0;for(let i=0;i<px.length;i+=4){if(px[i]>threshold&&px[i+1]>threshold&&px[i+2]>threshold&&px[i+3]>0){px[i+3]=0;removed++}}sc.putImageData(imageData,0,0);studioState.textureProcessed=source;const preview=$('[data-preview-processed]',root),pctx=preview.getContext('2d');pctx.clearRect(0,0,preview.width,preview.height);const ratio2=Math.min(preview.width/w,preview.height/h);const pw=w*ratio2,ph=h*ratio2;pctx.drawImage(source,(preview.width-pw)/2,(preview.height-ph)/2,pw,ph);$('[data-texture-status]',root).textContent=`Порог ${threshold} · обработано ${w}×${h} · прозрачных пикселей: ${removed.toLocaleString('ru-RU')}. Фон удаляется по условию R, G и B > порога.`}
function applyTexture(root){if(!studioState.textureOriginal||!studioState.textureProcessed){toast('Сначала загрузите изображение');return}const data=studioState.textureProcessed.toDataURL('image/png');const base=(studioState.textureFileName||'texture').replace(/\.[^.]+$/,'');const file=saveImageToPictures(base+'_без_фона.png',data,'image/png');const target=scene.objects.find(o=>o.id===(studioState.textureObjectId||studioState.selected));if(target){target.texture=data;target.textureAssetId=file.id;saveScene();studioState.selected=target.id;renderStudio(root);studioLog('Текстура применена к объекту '+target.name)}else studioLog('Текстура сохранена в «Изображения» (объект не выбран)');toast('Текстура сохранена в «Изображения»');closeTextureEditor(root)}

try{const saved=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'{}');if(saved&&typeof saved==='object'){if(/^#[0-9a-f]{6}$/i.test(saved.accent||''))customization.accent=saved.accent;if(Object.hasOwn(WALLPAPERS,saved.wallpaper))customization.wallpaper=saved.wallpaper}}catch{}

/** Toast messages are created with textContent so messages never become HTML. */
toast=function(message,kind='info'){
  const t=$('#toast');if(!t)return;
  const symbols={info:'i',success:'✓',error:'!',warning:'!'};
  t.replaceChildren();const symbol=document.createElement('span');symbol.className='toast-symbol';symbol.setAttribute('aria-hidden','true');symbol.textContent=symbols[kind]||symbols.info;
  const text=document.createElement('span');text.className='toast-message';text.textContent=String(message);t.append(symbol,text);t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2900);
};

/* A quota-safe filesystem writer keeps edits in memory even when persistent quota is full. */

  catch(err){fsPersistent=false;console.warn('Мастер ОС: localStorage save failed',err);if(!fsQuotaWarned){fsQuotaWarned=true;toast('Изменения остались в памяти, но браузер не смог записать ФС: проверьте свободное место','warning')}return false}
};

if(!Array.isArray(recycleBin))recycleBin=[];

/* Add an image thumbnail separately from the original data URL. */
const _saveImageToPicturesEnhanced=saveImageToPictures;
saveImageToPictures=function(name,dataUrl,mime='image/png'){
  const item=_saveImageToPicturesEnhanced(name,dataUrl,mime);
  try{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');const scale=Math.min(1,160/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);item.thumbnail=c.toDataURL('image/png');saveFs()}catch(err){console.warn('Не удалось подготовить миниатюру',err)}};img.src=dataUrl}catch(err){console.warn(err)}
  return item;
};

function makeTerminal(){

   if(cmd==='mkdir'){const name=args.join(' ');const dest=nodeAt(cwd);if(!name||!dest||dest.type!=='folder'){print('Использование: mkdir <название>');return}createFile(dest,name,{type:'folder'});print('Создана папка: '+name);return}
   if(cmd==='rm'){if(!args.length){print('Использование: rm <имя>');return}let removed=0;for(const target of args){const res=resolve(target);if(!res?.node||!res.parent){print('Не найдено: '+target);continue}const idx=res.parent.children.findIndex(x=>x.id===res.node.id);if(idx>=0){const item=res.parent.children.splice(idx,1)[0];item._restoreParentId=res.parent.id;recycleBin.push(item);removed++}}if(removed){saveFs();print(`В Корзину перемещено элементов: ${removed}`)}return}
   print('Неизвестная команда: '+cmd+' · введите help');
  }

 const topdown=mosMode()==='topdown';

 if(topdown){
  const sp=190*(inp.run?1.6:1),k=Math.min(1,18*dt);

  player.vy=(player.vy||0)+(inp.my*sp-(player.vy||0))*k;
  if(!inp.mx&&Math.abs(player.vx)<1)player.vx=0;
  if(!inp.my&&Math.abs(player.vy)<1)player.vy=0;
  const solids=scene.objects.filter(o=>o.id!==player.id&&o.solid&&o.type!=='trigger');
  if(!player.static){
   player.x+=player.vx*dt;

  if(jump&&(player.vy||0)<0)player.vy=Math.max(-480,player.vy-500*dt);
  if(!player.static){
   player.x+=(player.vx||0)*dt;
   if(player.gravity){
    player.vy=Math.min(900,(player.vy||0)+Math.max(0,scene.gravity||900)*dt);
    player.y+=(player.vy||0)*dt;
   }
  }
  player.onGround=false;
  for(const o of scene.objects){
   if(o.id===player.id||!o.solid||(!o.static&&!o.gravity)||o.type==='trigger')continue;
   if(!aabb(player,o))continue;
   const oldBottom=prevY+player.h,oldTop=prevY,oldRight=prevX+player.w,oldLeft=prevX;
   if(player.vy>=0&&oldBottom<=o.y+Math.max(8,Math.abs((player.vy||0)*dt)+2)){player.y=o.y-player.h;player.vy=0;player.onGround=true}
   else if(player.vy<0&&oldTop>=o.y+o.h-Math.max(5,Math.abs(player.vy*dt))){player.y=o.y+o.h;player.vy=0}
   else if(player.vx>0&&oldRight<=o.x+Math.abs(player.vx*dt)+2){player.x=o.x-player.w;player.vx=0}
   else if(player.vx<0&&oldLeft>=o.x+o.w-Math.abs(player.vx*dt)-2){player.x=o.x+o.w;player.vx=0}
  }
 }
 for(const t of scene.objects.filter(o=>o.type==='trigger')){
  if(aabb(player,t)&&!t._inside){t._inside=true;studioLog('Триггер активирован: '+t.name)}
  else if(!aabb(player,t))t._inside=false;
 }
};

/* Keyboard shortcuts only act on the topmost focused window and never steal text input. */
function isTextTarget(target){return !!target?.closest?.('input,textarea,select,[contenteditable="true"],[role="textbox"]')}
window.addEventListener('keydown',e=>{
 const active=[...windows.values()].filter(w=>w.classList.contains('open')&&!w.classList.contains('minimized')).sort((a,b)=>(+b.style.zIndex||0)-(+a.style.zIndex||0))[0];
 if(isTextTarget(e.target))return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(active?.dataset.window==='studio'){saveScene();toast('Сцена сохранена','success')}else if(active?.dataset.window==='blender'){$('[data-savefs]',active)?.click()}return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&active?.dataset.window==='studio'){e.preventDefault();undoScene();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&active?.dataset.window==='studio'){e.preventDefault();redoScene();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&active?.dataset.window==='studio'){copyStudioObjects();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&active?.dataset.window==='studio'){pasteStudioObjects();return}
 if(active?.dataset.window!=='studio'&&['ArrowLeft','ArrowRight','ArrowUp',' ','Delete','Escape'].includes(e.key))e.stopImmediatePropagation();
 if(active?.dataset.window==='studio'&&studioState.playing&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','A','D','W','S','Shift'].includes(e.key)){e.preventDefault();studioState.keys.add(e.key)}
 if(e.key==='Escape'){$('#context-menu').style.display='none';const shade=$('.studio [data-modal-shade]');if(shade&&!shade.classList.contains('hidden'))closeTextureEditor($('.studio',windows.get('studio')))}
},true);
window.addEventListener('keyup',e=>{const k=String(e.key);studioState.keys.delete(k);studioState.keys.delete(k.toLowerCase());studioState.keys.delete(k.toUpperCase())});
window.addEventListener('blur',()=>{studioState.keys.clear();if(studioState.ctlInput){studioState.ctlInput.btn.clear();studioState.ctlInput.stick.x=studioState.ctlInput.stick.y=0}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){studioState.keys.clear();if(studioState.playing)togglePlay(false);clearTimeout(sceneSaveTimer);try{localStorage.setItem(SCENE_KEY,JSON.stringify(scene))}catch{}}});

/* Correct context-menu positioning and escape labels. */
showContextMenu=function(x,y,items){const menu=$('#context-menu');menu.setAttribute('role','menu');menu.setAttribute('aria-label','Контекстное меню');menu.innerHTML=items.map((it,i)=>it==='-'?'<div class="context-divider" role="separator"></div>':`<button class="context-item" role="menuitem" data-ci="${i}">${escapeHtml(it.label)}</button>`).join('');menu.style.display='block';menu.style.left='0px';menu.style.top='0px';const vv=window.visualViewport;const leftEdge=vv?Math.max(0,vv.offsetLeft):0;const visibleRight=vv?Math.min(innerWidth,vv.offsetLeft+vv.width):innerWidth;const visibleBottom=vv?Math.min(innerHeight,vv.offsetTop+vv.height):innerHeight;const reserve=innerWidth<=650&&!document.body.classList.contains('keyboard-open')?($('#taskbar')?.getBoundingClientRect().height||54)+8:8;menu.style.maxHeight=Math.max(120,visibleBottom-reserve-16)+'px';const r=menu.getBoundingClientRect();menu.style.left=Math.max(leftEdge+8,Math.min(x,visibleRight-r.width-8))+'px';menu.style.top=Math.max((vv?vv.offsetTop:0)+8,Math.min(y,visibleBottom-reserve-r.height-8))+'px';$$('[data-ci]',menu).forEach(b=>b.addEventListener('click',()=>{const it=items[+b.dataset.ci];menu.style.display='none';if(it?.action)it.action()}))};

/* Make the loading indicator available in the document and set up safe show-desktop focus. */
if(!$('#loading-indicator')){const loading=document.createElement('div');loading.id='loading-indicator';loading.setAttribute('aria-hidden','true');document.body.appendChild(loading)}
window.addEventListener('pagehide',()=>{clearTimeout(sceneSaveTimer);try{localStorage.setItem(SCENE_KEY,JSON.stringify(scene));if(vfs&&Array.isArray(vfs.children))localStorage.setItem(FS_KEY,JSON.stringify(vfs));localStorage.setItem(TRASH_KEY,JSON.stringify(recycleBin))}catch{}});

/* mobile: один общий обработчик visualViewport для экранной клавиатуры */
(function setupMobileViewport(){
  const vv=window.visualViewport;
  if(!vv)return;
  let raf=0;
  const update=()=>{
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      document.documentElement.style.setProperty('--vv-height',Math.round(vv.height)+'px');
      document.documentElement.style.setProperty('--vv-top',Math.round(vv.offsetTop)+'px');
      const target=document.activeElement;
      const textEntry=!!target&&target.matches('input,textarea,select,[contenteditable="true"]');
      const keyboardLikely=textEntry&&innerWidth<900&&(innerHeight-vv.height>120||screen.height-vv.height>260);
      document.body.classList.toggle('keyboard-open',!!keyboardLikely);
    });
  };
  vv.addEventListener('resize',update,{passive:true});
  vv.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',update,{passive:true});
  document.addEventListener('focusin',e=>{
    if(!e.target.matches?.('input,textarea,select,[contenteditable="true"]'))return;
    update();
    setTimeout(()=>{
      if(document.activeElement===e.target)e.target.scrollIntoView?.({block:'nearest',inline:'nearest'});
      update();
    },80);
  });
  document.addEventListener('focusout',()=>setTimeout(update,120));
  update();
})();
